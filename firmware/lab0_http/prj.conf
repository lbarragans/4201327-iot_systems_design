CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG_MODE_IMMEDIATE=y
# Aumento de stacks para evitar timeouts en el handshake WPA2
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_STA_SAMPLE_SSID="BRINA"
CONFIG_STA_SAMPLE_PASSWORD="APT402Lu"

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
