CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONFIG_SETTINGS=n

CONFIG_WIFI=y

# HTTP server
CONFIG_LAB_HTTP_SERVER_ADDR="192.168.1.77"
CONFIG_LAB_HTTP_SERVER_PORT=8000
CONFIG_LAB_HTTP_PATH="/"
